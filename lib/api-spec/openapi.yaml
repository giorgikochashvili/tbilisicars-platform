          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateBrandBody"
      responses:
        "201":
          description: Created brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBrand"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/fleet/brands/{id}:
    get:
      operationId: getAdminBrand
      tags: [admin-fleet]
      summary: Get single brand (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Brand record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBrand"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Brand not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateAdminBrand
      tags: [admin-fleet]
      summary: Update brand (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateBrandBody"
      responses:
        "200":
          description: Updated brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBrand"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Brand not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminBrand
      tags: [admin-fleet]
      summary: Delete brand (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Brand not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/fleet/models:
    get:
      operationId: listAdminModels
      tags: [admin-fleet]
      summary: List all vehicle models (admin)
      responses:
        "200":
          description: Array of all vehicle models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminVehicleModelItem"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createAdminModel
      tags: [admin-fleet]
      summary: Create vehicle model (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateVehicleModelBody"
      responses:
        "201":
          description: Created vehicle model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleModelDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/fleet/models/{id}:
    get:
      operationId: getAdminModel
      tags: [admin-fleet]
      summary: Get single vehicle model (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle model with nested brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleModelDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateAdminModel
      tags: [admin-fleet]
      summary: Update vehicle model (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateVehicleModelBody"
      responses:
        "200":
          description: Updated vehicle model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleModelDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminModel
      tags: [admin-fleet]
      summary: Delete vehicle model (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/fleet/groups:
    get:
      operationId: listAdminGroups
      tags: [admin-fleet]
      summary: List all vehicle groups (admin)
      description: Returns all vehicle groups including inactive ones.
      responses:
        "200":
          description: Array of all vehicle groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminVehicleGroupItem"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/fleet/groups/{id}:
    get:
      operationId: getAdminGroup
      tags: [admin-fleet]
      summary: Get single vehicle group (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle group record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleGroupItem"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/fleet/vehicles:
    get:
      operationId: listAdminVehicles
      tags: [admin-fleet]
      summary: Paginated vehicle list (admin)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [AVAILABLE, RENTED, MAINTENANCE, RESERVED, INACTIVE]
        - name: locationId
          in: query
          schema:
            type: integer
        - name: modelId
          in: query
          schema:
            type: integer
        - name: groupId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paginated vehicle list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehiclePaginatedResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createAdminVehicle
      tags: [admin-fleet]
      summary: Create vehicle (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateVehicleBody"
      responses:
        "201":
          description: Created vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/fleet/vehicles/{id}:
    get:
      operationId: getAdminVehicle
      tags: [admin-fleet]
      summary: Get single vehicle (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle with nested model and group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Admin Extras ─────────────────────────────────────────────────────────────

    patch:
      operationId: updateAdminVehicle
      tags: [admin-fleet]
      summary: Update vehicle (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateVehicleBody"
      responses:
        "200":
          description: Updated vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminVehicle
      tags: [admin-fleet]
      summary: Delete vehicle (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/extras:
    get:
      operationId: listAdminExtras
      tags: [admin-extras]
      summary: List all extras (admin)
      description: Returns all extras including inactive ones.
      responses:
        "200":
          description: Array of all extras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminExtra"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createAdminExtra
      tags: [admin-extras]
      summary: Create extra (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateExtraBody"
      responses:
        "201":
          description: Created extra
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminExtra"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/extras/{id}:
    get:
      operationId: getAdminExtra
      tags: [admin-extras]
      summary: Get single extra (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Extra record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminExtra"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Extra not found
          content:
            application/json:
