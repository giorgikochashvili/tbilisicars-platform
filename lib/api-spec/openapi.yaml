        "200":
          description: Array of all brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminBrand"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createAdminBrand
      tags: [admin-fleet]
      summary: Create brand (admin)
      requestBody:
        required: true
