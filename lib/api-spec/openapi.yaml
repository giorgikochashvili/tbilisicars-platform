openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Admin authentication
  - name: locations
    description: Pickup and return locations
  - name: fleet
    description: Brands, models, groups, and individual vehicles
  - name: rates
    description: Rental pricing rates and tiers
  - name: extras
    description: Add-on extras available at booking
  - name: admin-locations
    description: Admin — locations and one-way fees
  - name: admin-fleet
    description: Admin — brands, models, groups, and vehicles
  - name: admin-extras
    description: Admin — extras catalog management
  - name: admin-rates
    description: Admin — rates and pricing tiers
  - name: admin-promos
    description: Admin — promotions and discount codes
  - name: admin-customers
    description: Admin — customer accounts

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Admin Auth ───────────────────────────────────────────────────────────────

  /auth/admin/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      description: Authenticates an admin with email and password. Sets a session cookie on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginBody"
      responses:
        "200":
          description: Login successful — returns admin profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfile"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/admin/logout:
    post:
      operationId: adminLogout
      tags: [auth]
      summary: Admin logout
      description: Destroys the current session.
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message

  /auth/admin/me:
    get:
      operationId: getAdminMe
      tags: [auth]
      summary: Get current admin profile
      description: Returns the profile of the currently authenticated admin.
      responses:
        "200":
          description: Current admin profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated but not an active admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Locations ────────────────────────────────────────────────────────────────

  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: List active locations
      responses:
        "200":
          description: Array of active locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"

  /locations/{id}:
    get:
      operationId: getLocation
      tags: [locations]
      summary: Get a location by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Location found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Fleet ────────────────────────────────────────────────────────────────────

  /fleet/brands:
    get:
      operationId: listFleetBrands
      tags: [fleet]
      summary: List vehicle brands
      responses:
        "200":
          description: Array of brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"

  /fleet/models:
    get:
      operationId: listFleetModels
      tags: [fleet]
      summary: List active vehicle models
      responses:
        "200":
          description: Array of vehicle models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleModel"

  /fleet/groups:
    get:
      operationId: listFleetGroups
      tags: [fleet]
      summary: List active vehicle groups
      responses:
        "200":
          description: Array of vehicle groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleGroup"

  /fleet/vehicles:
    get:
      operationId: listFleetVehicles
      tags: [fleet]
      summary: List vehicles with optional filters
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [AVAILABLE, RENTED, MAINTENANCE, RESERVED, INACTIVE]
        - name: locationId
          in: query
          required: false
          schema:
            type: integer
        - name: vehicleGroupId
          in: query
          required: false
          schema:
            type: integer
        - name: vehicleModelId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Array of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"

  /fleet/vehicles/{id}:
    get:
      operationId: getFleetVehicle
      tags: [fleet]
      summary: Get a vehicle by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Rates ────────────────────────────────────────────────────────────────────

  /rates:
    get:
      operationId: listRates
      tags: [rates]
      summary: List active rates (with tiers)
      responses:
        "200":
          description: Array of active rates including their tiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RateWithTiers"

  /rates/{id}:
    get:
      operationId: getRate
      tags: [rates]
      summary: Get a rate by ID (with tiers)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rate found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateWithTiers"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Extras ───────────────────────────────────────────────────────────────────

  /extras:
    get:
      operationId: listExtras
      tags: [extras]
      summary: List active extras
      responses:
        "200":
          description: Array of active extras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Extra"

  # ─── Admin Locations ──────────────────────────────────────────────────────────

  /admin/locations:
    get:
      operationId: listAdminLocations
      tags: [admin-locations]
      summary: List all locations (admin)
      description: Returns all locations including inactive ones.
      responses:
        "200":
          description: Array of all locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminLocation"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/locations/{id}:
    get:
      operationId: getAdminLocation
      tags: [admin-locations]
      summary: Get single location (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Location record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLocation"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/one-way-fees:
    get:
      operationId: listAdminOneWayFees
      tags: [admin-locations]
      summary: List all one-way fees (admin)
      responses:
        "200":
          description: Array of one-way fee rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOneWayFeeItem"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Admin Fleet ──────────────────────────────────────────────────────────────

  /admin/fleet/brands:
    get:
      operationId: listAdminBrands
      tags: [admin-fleet]
      summary: List all brands (admin)
      responses:
        "200":
          description: Array of all brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminBrand"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/fleet/brands/{id}:
    get:
      operationId: getAdminBrand
      tags: [admin-fleet]
      summary: Get single brand (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Brand record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBrand"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Brand not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/fleet/models:
    get:
      operationId: listAdminModels
      tags: [admin-fleet]
      summary: List all vehicle models (admin)
      responses:
        "200":
          description: Array of all vehicle models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminVehicleModelItem"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/fleet/models/{id}:
    get:
      operationId: getAdminModel
      tags: [admin-fleet]
      summary: Get single vehicle model (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle model with nested brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleModelDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/fleet/groups:
    get:
      operationId: listAdminGroups
      tags: [admin-fleet]
      summary: List all vehicle groups (admin)
      description: Returns all vehicle groups including inactive ones.
      responses:
        "200":
          description: Array of all vehicle groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminVehicleGroupItem"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/fleet/groups/{id}:
    get:
      operationId: getAdminGroup
      tags: [admin-fleet]
      summary: Get single vehicle group (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle group record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleGroupItem"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/fleet/vehicles:
    get:
      operationId: listAdminVehicles
      tags: [admin-fleet]
      summary: Paginated vehicle list (admin)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [AVAILABLE, RENTED, MAINTENANCE, RESERVED, INACTIVE]
        - name: locationId
          in: query
          schema:
            type: integer
        - name: modelId
          in: query
          schema:
            type: integer
        - name: groupId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paginated vehicle list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehiclePaginatedResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/fleet/vehicles/{id}:
    get:
      operationId: getAdminVehicle
      tags: [admin-fleet]
      summary: Get single vehicle (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle with nested model and group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Admin Extras ─────────────────────────────────────────────────────────────

  /admin/extras:
    get:
      operationId: listAdminExtras
      tags: [admin-extras]
      summary: List all extras (admin)
      description: Returns all extras including inactive ones.
      responses:
        "200":
          description: Array of all extras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminExtra"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/extras/{id}:
    get:
      operationId: getAdminExtra
      tags: [admin-extras]
      summary: Get single extra (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Extra record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminExtra"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Extra not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Admin Rates ──────────────────────────────────────────────────────────────

  /admin/rates:
    get:
      operationId: listAdminRates
      tags: [admin-rates]
      summary: List all rates (admin)
      description: Returns all rates including inactive ones. Tiers not included in list.
      responses:
        "200":
          description: Array of all rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminRate"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/rates/{id}:
    get:
      operationId: getAdminRate
      tags: [admin-rates]
      summary: Get single rate with tiers (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rate with nested tiers array
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRateDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Admin Promos ─────────────────────────────────────────────────────────────

  /admin/promos:
    get:
      operationId: listAdminPromos
      tags: [admin-promos]
      summary: List all promotions (admin)
      description: Returns all promotions including inactive ones.
      responses:
        "200":
          description: Array of all promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPromo"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/promos/{id}:
    get:
      operationId: getAdminPromo
      tags: [admin-promos]
      summary: Get single promotion (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Promotion record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPromo"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Promotion not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Admin Customers ──────────────────────────────────────────────────────────

  /admin/customers:
    get:
      operationId: listAdminCustomers
      tags: [admin-customers]
      summary: Paginated customer list (admin)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated customer list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCustomerPaginatedResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/customers/{id}:
    get:
      operationId: getAdminCustomer
      tags: [admin-customers]
      summary: Get single customer (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCustomer"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:

    # ─── Common ─────────────────────────────────────────────────────────────────

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ─── Locations ──────────────────────────────────────────────────────────────

    Location:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        latitude:
          type: ["string", "null"]
        longitude:
          type: ["string", "null"]
        locationType:
          type: string
          enum: [meet_and_greet, rental_office]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - locationType
        - isActive
        - createdAt
        - updatedAt

    # ─── Fleet ──────────────────────────────────────────────────────────────────

    Brand:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        logoUrl:
          type: ["string", "null"]
        countryOfOrigin:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt
        - updatedAt

    VehicleModel:
      type: object
      properties:
        id:
          type: integer
        brandId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        active:
          type: boolean
        availableForExternalSystems:
          type: boolean
        category:
          type: ["string", "null"]
        seats:
          type: ["integer", "null"]
        doors:
          type: ["integer", "null"]
        transmission:
          type: ["string", "null"]
          enum: [MANUAL, AUTOMATIC, null]
        fuelType:
          type: ["string", "null"]
          enum: [PETROL, DIESEL, HYBRID, ELECTRIC, null]
        luggageCapacity:
          type: ["integer", "null"]
        mileageLimitPerDay:
          type: ["integer", "null"]
        deposit:
          type: ["string", "null"]
        brand:
          type: ["object", "null"]
          properties:
            id:
              type: integer
            name:
              type: string
            logoUrl:
              type: ["string", "null"]
          required:
            - id
            - name
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - brandId
        - name
        - active
        - availableForExternalSystems
        - brand
        - createdAt
        - updatedAt

    VehicleGroup:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        seats:
          type: ["integer", "null"]
        doors:
          type: ["integer", "null"]
        transmission:
          type: ["string", "null"]
        fuelType:
          type: ["string", "null"]
        basePricePerDay:
          type: ["string", "null"]
        basePricePerWeek:
          type: ["string", "null"]
        basePricePerMonth:
          type: ["string", "null"]
        features:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        displayOrder:
          type: ["integer", "null"]
        active:
          type: ["boolean", "null"]
        minRentalDays:
          type: ["integer", "null"]
        maxRentalDays:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt
        - updatedAt

    Vehicle:
      type: object
      properties:
        id:
          type: integer
        vehicleModelId:
          type: ["integer", "null"]
        vehicleGroupId:
          type: ["integer", "null"]
        year:
          type: ["integer", "null"]
        color:
          type: ["string", "null"]
        licensePlate:
          type: ["string", "null"]
        vehicleClass:
          type: ["string", "null"]
          enum: [ECONOMY, COMPACT, MIDSIZE, STANDARD, FULLSIZE, PREMIUM, LUXURY, SUV, MINIVAN, VAN, TRUCK, null]
        fuelType:
          type: ["string", "null"]
          enum: [PETROL, DIESEL, HYBRID, ELECTRIC, null]
        transmission:
