openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Admin authentication
  - name: locations
    description: Pickup and return locations
  - name: fleet
    description: Brands, models, groups, and individual vehicles
  - name: rates
    description: Rental pricing rates and tiers
  - name: extras
    description: Add-on extras available at booking
  - name: admin-locations
    description: Admin — locations and one-way fees
  - name: admin-fleet
    description: Admin — brands, models, groups, and vehicles
  - name: admin-extras
    description: Admin — extras catalog management
  - name: admin-rates
    description: Admin — rates and pricing tiers
  - name: admin-promos
    description: Admin — promotions and discount codes
  - name: admin-customers
    description: Admin — customer accounts
  - name: admin-bookings
    description: Admin — bookings management
  - name: admin-dashboard
    description: Admin — operations dashboard
  - name: admin-team
    description: Admin — team member management
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Admin Auth ───────────────────────────────────────────────────────────────

  /auth/admin/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      description: Authenticates an admin with email and password. Sets a session cookie on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginBody"
      responses:
        "200":
          description: Login successful — returns admin profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfile"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/admin/logout:
    post:
      operationId: adminLogout
      tags: [auth]
      summary: Admin logout
      description: Destroys the current session.
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message

  /auth/admin/me:
    get:
      operationId: getAdminMe
      tags: [auth]
      summary: Get current admin profile
      description: Returns the profile of the currently authenticated admin.
      responses:
        "200":
          description: Current admin profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated but not an active admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Locations ────────────────────────────────────────────────────────────────

  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: List active locations
      responses:
        "200":
          description: Array of active locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"

  /locations/{id}:
    get:
      operationId: getLocation
      tags: [locations]
      summary: Get a location by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Location found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Fleet ────────────────────────────────────────────────────────────────────

  /fleet/brands:
    get:
      operationId: listFleetBrands
      tags: [fleet]
      summary: List vehicle brands
      responses:
        "200":
          description: Array of brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"

  /fleet/models:
    get:
      operationId: listFleetModels
      tags: [fleet]
      summary: List active vehicle models
      responses:
        "200":
          description: Array of vehicle models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleModel"

  /fleet/groups:
    get:
      operationId: listFleetGroups
      tags: [fleet]
      summary: List active vehicle groups
      responses:
        "200":
          description: Array of vehicle groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleGroup"

  /fleet/vehicles:
    get:
      operationId: listFleetVehicles
      tags: [fleet]
      summary: List vehicles with optional filters
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [AVAILABLE, RENTED, MAINTENANCE, RESERVED, INACTIVE]
        - name: locationId
          in: query
          required: false
          schema:
            type: integer
        - name: vehicleGroupId
          in: query
          required: false
          schema:
            type: integer
        - name: vehicleModelId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Array of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"

  /fleet/vehicles/{id}:
    get:
      operationId: getFleetVehicle
      tags: [fleet]
      summary: Get a vehicle by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Rates ────────────────────────────────────────────────────────────────────

  /rates:
    get:
      operationId: listRates
      tags: [rates]
      summary: List active rates (with tiers)
      responses:
        "200":
          description: Array of active rates including their tiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RateWithTiers"

  /rates/{id}:
    get:
      operationId: getRate
      tags: [rates]
      summary: Get a rate by ID (with tiers)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rate found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateWithTiers"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Extras ───────────────────────────────────────────────────────────────────

  /extras:
    get:
      operationId: listExtras
      tags: [extras]
      summary: List active extras
      responses:
        "200":
          description: Array of active extras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Extra"

  # ─── Admin Locations ──────────────────────────────────────────────────────────

  /admin/locations:
    get:
      operationId: listAdminLocations
      tags: [admin-locations]
      summary: List all locations (admin)
      description: Returns all locations including inactive ones.
      responses:
        "200":
          description: Array of all locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminLocation"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createAdminLocation
      tags: [admin-locations]
      summary: Create location (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateLocationBody"
      responses:
        "201":
          description: Created location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLocation"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/locations/{id}:
    get:
      operationId: getAdminLocation
      tags: [admin-locations]
      summary: Get single location (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Location record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLocation"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateAdminLocation
      tags: [admin-locations]
      summary: Update location (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateLocationBody"
      responses:
        "200":
          description: Updated location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLocation"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminLocation
      tags: [admin-locations]
      summary: Delete location (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/one-way-fees:
    get:
      operationId: listAdminOneWayFees
      tags: [admin-locations]
      summary: List all one-way fees (admin)
      responses:
        "200":
          description: Array of one-way fee rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOneWayFeeItem"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

